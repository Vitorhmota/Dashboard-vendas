name: Atualizar Dashboard Automaticamente

on:
  # Roda todo dia às 08:00 UTC (05:00 horário de Brasília)
  schedule:
    - cron: '0 8 * * *'
  
  # Permite que você clique em um botão no GitHub para atualizar na hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Executar scripts para gerar novo data.json
        run: |
          python 01_criar_banco.py
          python 02_atualizar_dashboard.py

      - name: 4. Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json vendas.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automático: dados atualizados pelo GitHub Actions [skip ci]" && git push)

